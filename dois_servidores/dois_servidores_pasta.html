<body>
  <main>
    <h1>Pedido</h1>
    <p class="lede">Quem usa o serviço vê uma tela só. Servidor A e Servidor B continuam em processos separados.</p>
    <form id="formulario">
      <label for="valor">Valor (R$)</label>
      <input id="valor" name="valor" type="number" min="0" step="0.01" value="120.00" required="">
      <button type="submit">Pagar</button>
    </form>
    <section id="resultado" aria-live="polite">
      <h2 id="titulo"></h2>
      <p id="mensagem"></p>
      <dl>
        <dt>Pedido</dt><dd id="pedido"></dd>
        <dt>Nome resolvido</dt><dd id="nome"></dd>
        <dt>Identificador</dt><dd id="identificador"></dd>
        <dt>Endereço</dt><dd id="endereco"></dd>
        <dt>Relógio de A / relógio de B</dt><dd id="horas"></dd>
        <dt>Ordem lógica</dt><dd id="ordem"></dd>
      </dl>
    </section>
  </main>
  <script>
    // Onde: a tela pronta. O aluno não escreve este arquivo.
    // Por quê: o exercício é a mensagem entre A e B, não a montagem da página.
    const formulario = document.getElementById("formulario");
    const painel = document.getElementById("resultado");

    // Onde: apresentação do que A respondeu.
    // Por quê: cada campo do rastro (pedido, nome, hora, L) ocupa um lugar fixo na tela.
    // Como: acha o elemento pelo id e troca o texto.
    // Exemplo: texto("endereco", "127.0.0.1:5001") preenche a linha Endereço.
    function texto(id, valor) {
      document.getElementById(id).textContent = valor;
    }

    // Onde: UN3 S4, o clique é o evento.
    // Por quê: a programação por eventos reage a um fato. Aqui o fato é Pagar.
    // Como: submit dispara a função. preventDefault impede o navegador de recarregar a página.
    // Exemplo: clicar com 120 chama o fetch abaixo uma vez.
    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();

      // Onde: UN3 S1, o usuário fala só com A.
      // Por quê: a visão única seria quebrada se a página chamasse a porta de B.
      // Como: fetch("/pedido") usa o mesmo endereço da página, http://127.0.0.1:5000/pedido.
      // Exemplo: o corpo {"valor": 120} não cita servidor-b, porta 5001 nem o limite.
      const valor = document.getElementById("valor").value;
      const resposta = await fetch("/pedido", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ valor: Number(valor) }),
      });

      // Onde: UN3 S4, a página reage à resposta do serviço.
      // Por quê: A já coordenou com B. A tela só mostra o fato devolvido.
      // Como: o JSON de A vira o objeto dados.
      // Exemplo: dados.status vale "APROVADO", "RECUSADO" ou "FALHA".
      const dados = await resposta.json();

      // Onde: UN3 S1, três desfechos visíveis.
      // Por quê: aprovado e recusado vieram de B; falha significa que B não respondeu.
      // Como: a classe CSS do painel é o próprio status.
      // Exemplo: FALHA pinta o quadro de amarelo e o título vira "Não concluído".
      painel.className = dados.status;
      const titulos = {
        APROVADO: "Aprovado",
        RECUSADO: "Recusado",
        FALHA: "Não concluído",
      };
      texto("titulo", titulos[dados.status] || dados.status);
      texto("mensagem", dados.mensagem);

      // Onde: UN3 S2, o lookup que A fez, mostrado para a turma.
      // Por quê: a tela deixa visível nome, id estável e endereço atual.
      // Como: copia os campos que servidor_a.py colocou no JSON.
      // Exemplo: nome servidor-b, id id-autorizacao-001, endereço 127.0.0.1:5002 depois da troca de porta.
      texto("pedido", dados.pedido);
      texto("nome", dados.nome);
      texto("identificador", dados.id);
      texto("endereco", dados.endereco);

      // Onde: UN3 S3, hora de parede contra ordem lógica.
      // Por quê: a hora de B pode estar atrás e o L da resposta continua maior que o L do envio.
      // Como: mostra as duas horas e, na linha de baixo, os três L.
      // Exemplo: "00:31:45 / 00:01:45" e "envio L=2 resposta L=3 fim em A L=4".
      // Se B não respondeu, hora_b vem vazio e L_resposta vem nulo: a tela mostra "sem resposta" e travessão.
      texto("horas", dados.hora_a + "  /  " + (dados.hora_b || "sem resposta"));
      texto(
        "ordem",
        "envio L=" + dados.L_envio +
        "   resposta L=" + (dados.L_resposta == null ? "—" : dados.L_resposta) +
        "   fim em A L=" + dados.L_final
      );
    });
  </script>
